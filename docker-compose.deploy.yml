# Self-hosted deployment: postgres + redis + api + web (nginx, single origin).
#   cp deploy/deploy.env.example deploy.env   # then edit secrets
#   docker compose -f docker-compose.deploy.yml --env-file deploy.env up -d --build
name: devlane-deploy
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devlane
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: devlane
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlane -d devlane"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ENV: production
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: devlane
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: devlane
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8180}
      APP_BASE_URL: ${PUBLIC_URL:-http://localhost:8180}
      FRONTEND_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8180}
      API_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8180}
      MAGIC_CODE_SECRET: ${MAGIC_CODE_SECRET:?set MAGIC_CODE_SECRET}
      INSTANCE_ENCRYPTION_KEY: ${INSTANCE_ENCRYPTION_KEY:?set INSTANCE_ENCRYPTION_KEY}

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8180}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg:
  redis:
